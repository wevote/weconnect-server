<html lang="en">
  <body>
    <h1>
      <img src="we-vote-logo-wordmark-vertical-color-on-white-256x256.png"  width="100" height="100" alt="">
    </h1>
    <h1>The weconnect-server is running</h1>
    <br />
    <div id="datetime"></div>
    <div id="versions"></div>
  </body>
</html>

<script src="https://cdn.jsdelivr.net/npm/axios@1.9.0/dist/axios.min.js"></script>
<script>
  const now = new Date();
  const datetime = now.toLocaleString();
  const url = `${window.location.href}apis/v1/versions`;
  axios.get(url).then((response) => {
    const keys = Object.keys(response.data);
    let html = '<div style="padding: 10px; display: grid; grid-template-columns: 8% auto" >'
    // html += `<span>Date</span><span>${datetime}</span>`;
    keys.forEach((key) => {
      if (key === 'git_commit_hash') {
        const lastIndex = response.data[key].lastIndexOf("/");
        const hash = response.data[key].substring(lastIndex + 1);
        html += `<span>Git Commit Hash</span>
                 <span>
                    <a href="${response.data[key]}">${hash}</a>
                 </span>`;
      } else if (key === 'git_committed_date') {
        html += `<span>Git Committed Date</span><span>${response.data[key]}</span>`;
      } else {
        html += `<span>${key}</span><span>${response.data[key]}</span>`;
      }
    });
    html += '</div>';
    document.getElementById('versions').innerHTML = html;
  });
</script>
